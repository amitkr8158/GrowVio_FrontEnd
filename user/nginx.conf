server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ── Security Headers ──────────────────────────────────────────────────
    # Prevents clickjacking
    add_header X-Frame-Options "DENY" always;
    # Prevents MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    # Legacy XSS filter (belt-and-suspenders)
    add_header X-XSS-Protection "1; mode=block" always;
    # Force HTTPS for 1 year (set after confirming HTTPS works)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Limits what data is included in Referer header
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Remove server version from responses
    server_tokens off;
    # Content Security Policy — restrict resource origins
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none';" always;
    # Permissions Policy — disable unnecessary browser features
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # ── React SPA — all unmatched routes serve index.html ─────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Reverse proxy — API Gateway (single entry point) ──────────────────
    # All /api/* and /ai/* traffic routes through api-gateway:8080
    # The gateway handles JWT validation, rate limiting, and circuit breaking.
    location /api/ {
        proxy_pass         http://api-gateway:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }

    location /ai/ {
        proxy_pass         http://api-gateway:8080/ai/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
        proxy_read_timeout 120s;    # AI calls take longer
        client_max_body_size 25m;   # PDF uploads
    }

    # ── Static asset caching ──────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Gzip ──────────────────────────────────────────────────────────────
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
}
